version: "3.4"
services:
  webgpu_dev:
    image: node:alpine
    container_name: webgpu_dev
    entrypoint: /bin/sh
    user: 1000:1000
    ports:
      - 5173:80
      - 9229:9229
    working_dir: /srv/app
    volumes:
      - type: bind
        source: ./../
        target: /srv/app/
      - type: bind
        source: ./../../pinata/
        target: /srv/pinata/
    tty: true
